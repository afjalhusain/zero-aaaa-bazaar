<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c8f45">
<meta name="description" content="जीरो AAAA बाज़ार - आपकी अपनी ऑनलाइन ग्रोसरी दुकान">
<title>जीरो AAAA बाज़ार</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans Devanagari,sans-serif;background:#f5f6f7;color:#171717}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 24px #0001}
.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:14px 14px 10px}
.brand{display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:21px;margin:0;color:#087b3c}
.brand small{color:#666}
.search{margin-top:11px;display:flex;align-items:center;background:#f2f4f3;border-radius:12px;padding:0 12px}
.search input{width:100%;border:0;outline:0;background:transparent;padding:12px 8px;font-size:15px}
.hero{margin:14px;background:#e9f8ef;border-radius:16px;padding:17px}
.hero h2{margin:0 0 5px;font-size:22px}
.hero p{margin:0;color:#555;font-size:13px}
.chips{display:flex;gap:8px;overflow:auto;padding:0 14px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#fff;border:1px solid #ddd;padding:9px 13px;border-radius:20px}
.chip.active{background:#087b3c;color:#fff;border-color:#087b3c}
.section{padding:5px 14px}
.section h3{margin:9px 0 12px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border:1px solid #e6e6e6;border-radius:14px;padding:10px;background:#fff}
.pic{height:105px;border-radius:11px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-size:55px}
.card h4{margin:9px 0 2px;font-size:15px}
.unit{font-size:12px;color:#777}
.price{margin-top:6px;font-weight:800}
.mrp{font-size:11px;color:#999;text-decoration:line-through;margin-left:5px;font-weight:400}
.add{width:100%;margin-top:9px;padding:9px;border-radius:9px;background:#087b3c;color:#fff;font-weight:700}
.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.qtyrow button{width:31px;height:31px;border-radius:8px;background:#e8f5ed;color:#087b3c;font-weight:800}
.qty{font-weight:800}
.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:20}
.navbtn{background:transparent;color:#666;padding:6px 18px}
.navbtn.active{color:#087b3c;font-weight:800}
.badge{display:inline-flex;min-width:19px;height:19px;padding:0 5px;align-items:center;justify-content:center;background:#e53935;color:#fff;border-radius:10px;font-size:11px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:50}
.modal.show{display:flex}
.sheet{width:100%;max-width:520px;margin:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px;max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 12px}
.close{float:right;background:#eee;border-radius:50%;width:32px;height:32px}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}
.primary{width:100%;background:#087b3c;color:#fff;padding:13px;border-radius:11px;font-weight:800;margin-top:12px}
.input{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;margin:6px 0 10px;outline:none}
.total{font-size:18px;font-weight:900;padding-top:12px}
.order{border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin:9px 0}
.status{display:inline-block;background:#eaf7ef;color:#087b3c;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:700}
.view{display:none}
.view.active{display:block}
.empty{text-align:center;padding:35px 10px;color:#777}
@media(min-width:700px){
body{background:#eef1ef}
.app{margin:20px auto;border-radius:18px;overflow:hidden}
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">

<div>
<h1>जीरो AAAA बाज़ार</h1>
<small>आपकी अपनी ऑनलाइन ग्रोसरी दुकान</small>
</div>

<button onclick="openCart()">
🛒 <span id="cartBadge" class="badge">0</span>
</button>

</div>

<div class="search">
🔎
<input id="search" placeholder="सामान खोजें..." oninput="renderProducts()">
</div>

</header>


<main id="homeView" class="view active">

<section class="hero">
<h2>घर का सामान, घर तक 🛍️</h2>
<p>ग्रोसरी, फल-सब्ज़ी, डेयरी, स्नैक्स और रोज़मर्रा का सामान।</p>
</section>

<div class="chips" id="chips"></div>

<section class="section">
<h3>लोकप्रिय सामान</h3>
<div id="products" class="grid"></div>
</section>

</main>


<main id="ordersView" class="view">

<section class="section">
<h3>मेरे ऑर्डर</h3>
<div id="orders"></div>
</section>

</main>


<main id="accountView" class="view">

<section class="section">

<h3>मेरा अकाउंट</h3>

<label>नाम</label>
<input class="input" id="custName" placeholder="अपना नाम">

<label>मोबाइल नंबर</label>
<input class="input" id="custPhone" placeholder="10 अंकों का मोबाइल नंबर" inputmode="numeric">

<label>डिलीवरी पता</label>
<textarea class="input" id="custAddress" rows="4" placeholder="पूरा डिलीवरी पता"></textarea>

<button class="primary" onclick="saveAccount()">सेव करें</button>

<p id="savedMsg" style="color:#087b3c"></p>

</section>

</main>


<nav class="bottom">

<button class="navbtn active" onclick="showView('homeView',this)">
🏠<br>होम
</button>

<button class="navbtn" onclick="showView('ordersView',this);renderOrders()">
📦<br>ऑर्डर
</button>

<button class="navbtn" onclick="openCart()">
🛒<br>कार्ट
</button>

<button class="navbtn" onclick="showView('accountView',this);loadAccount()">
👤<br>अकाउंट
</button>

</nav>

</div>


<div id="cartModal" class="modal" onclick="if(event.target===this)closeCart()">

<div class="sheet">

<button class="close" onclick="closeCart()">✕</button>

<h2>आपकी कार्ट</h2>

<div id="cartItems"></div>

<div id="cartTotal"></div>

<button class="primary" onclick="checkout()">
ऑर्डर करें
</button>

</div>

</div>


<div id="checkoutModal" class="modal" onclick="if(event.target===this)closeCheckout()">

<div class="sheet">

<button class="close" onclick="closeCheckout()">✕</button>

<h2>ऑर्डर की जानकारी</h2>

<input class="input" id="coName" placeholder="ग्राहक का नाम">

<input class="input" id="coPhone" placeholder="मोबाइल नंबर" inputmode="numeric">

<textarea class="input" id="coAddress" rows="3" placeholder="डिलीवरी पता"></textarea>

<select class="input" id="payment">

<option>Cash on Delivery (COD)</option>

<option>Online Payment</option>

</select>

<div id="coTotal" class="total"></div>

<button class="primary" onclick="placeOrder()">
ऑर्डर कन्फर्म करें
</button>

</div>

</div>


<script>

const products=[

{id:1,name:'आलू',unit:'1 kg',price:32,mrp:40,cat:'सब्ज़ी',img:'🥔'},

{id:2,name:'टमाटर',unit:'1 kg',price:38,mrp:45,cat:'सब्ज़ी',img:'🍅'},

{id:3,name:'प्याज़',unit:'1 kg',price:35,mrp:42,cat:'सब्ज़ी',img:'🧅'},

{id:4,name:'केला',unit:'1 दर्जन',price:55,mrp:65,cat:'फल',img:'🍌'},

{id:5,name:'सेब',unit:'1 kg',price:120,mrp:150,cat:'फल',img:'🍎'},

{id:6,name:'दूध',unit:'1 लीटर',price:66,mrp:70,cat:'डेयरी',img:'🥛'},

{id:7,name:'ब्रेड',unit:'400 g',price:45,mrp:50,cat:'बेकरी',img:'🍞'},

{id:8,name:'चावल',unit:'5 kg',price:330,mrp:370,cat:'राशन',img:'🍚'},

{id:9,name:'आटा',unit:'5 kg',price:260,mrp:290,cat:'राशन',img:'🌾'},

{id:10,name:'अरहर दाल',unit:'1 kg',price:145,mrp:165,cat:'राशन',img:'🫘'},

{id:11,name:'चीनी',unit:'1 kg',price:48,mrp:55,cat:'राशन',img:'🧂'},

{id:12,name:'सर्फ',unit:'1 kg',price:125,mrp:145,cat:'होम केयर',img:'🧺'},

{id:13,name:'डिशवॉश',unit:'500 ml',price:85,mrp:99,cat:'होम केयर',img:'🧽'},

{id:14,name:'टॉयलेट क्लीनर',unit:'500 ml',price:105,mrp:120,cat:'होम केयर',img:'🧴'},

{id:15,name:'बिस्किट',unit:'200 g',price:30,mrp:35,cat:'स्नैक्स',img:'🍪'},

{id:16,name:'नमकीन',unit:'200 g',price:45,mrp:55,cat:'स्नैक्स',img:'🥨'},

{id:17,name:'कोल्ड ड्रिंक',unit:'750 ml',price:45,mrp:50,cat:'ड्रिंक्स',img:'🥤'},

{id:18,name:'पानी',unit:'1 लीटर',price:20,mrp:20,cat:'ड्रिंक्स',img:'💧'},

{id:19,name:'शैम्पू',unit:'180 ml',price:110,mrp:130,cat:'पर्सनल केयर',img:'🧴'},

{id:20,name:'टूथपेस्ट',unit:'150 g',price:95,mrp:110,cat:'पर्सनल केयर',img:'🪥'},

{id:21,name:'टिश्यू',unit:'1 पैक',price:70,mrp:85,cat:'होम केयर',img:'🧻'},

{id:22,name:'चॉकलेट',unit:'1 पैक',price:60,mrp:70,cat:'स्नैक्स',img:'🍫'},

{id:23,name:'आइसक्रीम',unit:'1 पैक',price:90,mrp:110,cat:'डेयरी',img:'🍦'},

{id:24,name:'नूडल्स',unit:'1 पैक',price:55,mrp:65,cat:'खाना',img:'🍜'}

];


let category='सभी';

let cart=JSON.parse(localStorage.getItem('zeroAAAAcart')||'{}');

let orders=JSON.parse(localStorage.getItem('zeroAAAAorders')||'[]');


function save(){

localStorage.setItem(
'zeroAAAAcart',
JSON.stringify(cart)
);

updateBadge();

}


function updateBadge(){

document.getElementById('cartBadge').textContent=
Object.values(cart).reduce((a,b)=>a+b,0);

}


function cats(){

return [
'सभी',
...new Set(products.map(p=>p.cat))
];

}


function renderChips(){

document.getElementById('chips').innerHTML=

cats().map(c=>

`<button class="chip ${c===category?'active':''}"

onclick="category='${c}';renderChips();renderProducts()">

${c}

</button>`

).join('');

}


function renderProducts(){

const q=
document.getElementById('search')
.value
.trim()
.toLowerCase();


const list=products.filter(p=>

(category==='सभी'||p.cat===category)

&&

(!q||p.name.toLowerCase().includes(q))

);


document.getElementById('products').innerHTML=

list.length?

list.map(p=>{

const n=cart[p.id]||0;

return `

<article class="card">

<div class="pic">${p.img}</div>

<h4>${p.name}</h4>

<div class="unit">${p.unit}</div>

<div class="price">

₹${p.price}

<span class="mrp">₹${p.mrp}</span>

</div>

${n?

`

<div class="qtyrow">

<button onclick="changeQty(${p.id},-1)">−</button>

<span class="qty">${n}</span>

<button onclick="changeQty(${p.id},1)">+</button>

</div>

`

:

`

<button class="add" onclick="changeQty(${p.id},1)">

कार्ट में डालें

</button>

`

}

</article>

`;

}).join('')

:

`

<div class="empty" style="grid-column:1/-1">

कोई सामान नहीं मिला।

</div>

`;

updateBadge();

}


function changeQty(id,d){

cart[id]=(cart[id]||0)+d;

if(cart[id]<=0)
delete cart[id];

save();

renderProducts();

renderCart();

}


function openCart(){

renderCart();

document
.getElementById('cartModal')
.classList.add('show');

}


function closeCart(){

document
.getElementById('cartModal')
.classList.remove('show');

}


function cartData(){

return Object.entries(cart)

.map(([id,n])=>({

p:products.find(x=>x.id==id),
n

}))

.filter(x=>x.p);

}


function total(){

return cartData()
.reduce(
(s,x)=>s+x.p.price*x.n,
0
);

}


function renderCart(){

const items=cartData();


document.getElementById('cartItems').innerHTML=

items.length?

items.map(x=>

`

<div class="row">

<div>

${x.p.img}

<b>${x.p.name}</b>

<br>

<small>${x.p.unit}</small>

</div>

<div>

<b>₹${x.p.price*x.n}</b>

<br>

<button onclick="changeQty(${x.p.id},-1)">−</button>

${x.n}

<button onclick="changeQty(${x.p.id},1)">+</button>

</div>

</div>

`

).join('')

:

`

<div class="empty">

आपकी कार्ट खाली है।

<br>

पहले सामान कार्ट में डालें।

</div>

`;


document.getElementById('cartTotal').innerHTML=

items.length?

`

<div class="total">

कुल: ₹${total()}

</div>

`

:'';

}


function checkout(){

if(!cartData().length){

alert('कार्ट खाली है।');

return;

}


closeCart();


document.getElementById('coName').value=
localStorage.getItem('zeroAAAAname')||'';


document.getElementById('coPhone').value=
localStorage.getItem('zeroAAAAphone')||'';


document.getElementById('coAddress').value=
localStorage.getItem('zeroAAAAaddress')||'';


document.getElementById('coTotal').textContent=
'कुल भुगतान: ₹'+total();


document
.getElementById('checkoutModal')
.classList.add('show');

}


function closeCheckout(){

document
.getElementById('checkoutModal')
.classList.remove('show');

}


function placeOrder(){

const name=
document.getElementById('coName')
.value
.trim();

const phone=
document.getElementById('coPhone')
.value
.trim();

const address=
document.getElementById('coAddress')
.value
.trim();

const payment=
document.getElementById('payment')
.value;


if(!name||!phone||!address){

alert('नाम, मोबाइल नंबर और पता भरें।');

return;

}


const order={

id:'ZA'+Date.now().toString().slice(-8),

date:new Date().toLocaleString('hi-IN'),

items:cartData().map(x=>({

id:x.p.id,

name:x.p.name,

n:x.n,

price:x.p.price

})),

total:total(),

payment,

status:'ऑर्डर प्राप्त हुआ',

customer:{
name,
phone,
address
}

};


orders.unshift(order);


localStorage.setItem(
'zeroAAAAorders',
JSON.stringify(orders)
);


localStorage.setItem(
'zeroAAAAname',
name
);

localStorage.setItem(
'zeroAAAAphone',
phone
);

localStorage.setItem(
'zeroAAAAaddress',
address
);


cart={};

save();

closeCheckout();


showView(
'ordersView',
document.querySelectorAll('.navbtn')[1]
);


renderOrders();


alert(
'ऑर्डर सफलतापूर्वक भेज दिया गया। ऑर्डर नंबर: '
+order.id
);

}


function renderOrders(){

document.getElementById('orders').innerHTML=

orders.length?

orders.map(o=>

`

<div class="order">

<b>ऑर्डर #${o.id}</b>

<br>

<small>${o.date}</small>

<p>

${o.items.map(i=>

`${i.name} × ${i.n}`

).join(', ')}

</p>

<b>₹${o.total}</b>

<br>

<span class="status">

${o.status}

</span>

<br>

<small>

भुगतान: ${o.payment}

</small>

</div>

`

).join('')

:

`

<div class="empty">

अभी कोई ऑर्डर नहीं है।

</div>

`;

}


function showView(id,btn){

document
.querySelectorAll('.view')
.forEach(v=>
v.classList.remove('active')
);


document
.getElementById(id)
.classList.add('active');


document
.querySelectorAll('.navbtn')
.forEach(b=>
b.classList.remove('active')
);


if(btn)
btn.classList.add('active');


window.scrollTo({
top:0,
behavior:'smooth'
});

}


function saveAccount(){

localStorage.setItem(
'zeroAAAAname',
document.getElementById('custName').value.trim()
);

localStorage.setItem(
'zeroAAAAphone',
document.getElementById('custPhone').value.trim()
);

localStorage.setItem(
'zeroAAAAaddress',
document.getElementById('custAddress').value.trim()
);


document.getElementById('savedMsg').textContent=
'जानकारी सेव हो गई।';

}


function loadAccount(){

document.getElementById('custName').value=
localStorage.getItem('zeroAAAAname')||'';

document.getElementById('custPhone').value=
localStorage.getItem('zeroAAAAphone')||'';

document.getElementById('custAddress').value=
localStorage.getItem('zeroAAAAaddress')||'';

}


renderChips();

renderProducts();

updateBadge();

</script>

</body>
</html>
